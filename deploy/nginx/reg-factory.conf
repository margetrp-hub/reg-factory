# reg-factory 面板反代（Nginx，SG 主机）
#
# 前提：DNS 把 reg.ohlao.cfd 指向 140.245.54.144（Cloudflare 可用橙云或 DNS-only）。
# 安装：sudo ./sg-enable-https.sh reg.ohlao.cfd you@example.com
#
# 说明：
#   * 面板本身只监听 127.0.0.1:8799，公网唯一入口是这里；
#   * /api/logs/<run_id> 是 SSE，必须 proxy_buffering off + 长 read timeout；
#   * 面板会接收整段账号文本（/api/authorize-outlook 上限 5MB），body 放宽到 20m；
#   * 80 端口只保留 ACME 挑战与 301，不提供明文登录。

server {
    listen 80;
    listen [::]:80;
    server_name reg.ohlao.cfd;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reg.ohlao.cfd;

    ssl_certificate     /etc/letsencrypt/live/reg.ohlao.cfd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reg.ohlao.cfd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RFSG:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    client_max_body_size 20m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 运行日志：不缓冲、长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }
}
