# reg-factory 面板反代（仅 80 端口，DNS 就绪后立即可用）
#
# 用途：公网还没配 HTTPS 时先用这条把面板接出来；Cloudflare 橙云会在边缘
# 终结 TLS，回源走这里的 80。等证书签发完，用 sg-enable-https.sh 换成
# nginx/reg-factory.conf（80 只留 ACME + 301，443 才代理）。
#
# 安装：
#   sudo cp nginx/reg-factory-http.conf /etc/nginx/sites-available/reg-factory.conf
#   sudo ln -sfn /etc/nginx/sites-available/reg-factory.conf /etc/nginx/sites-enabled/reg-factory.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name reg.ohlao.cfd;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    client_max_body_size 20m;
    client_body_timeout 120s;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 运行日志是 SSE，不能缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }
}
