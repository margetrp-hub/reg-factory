# reg-factory 面板反代（SG 主机专用，复用本机现有 snippet）
#
# 安装位置：/etc/nginx/reg-factory.conf，由 /etc/nginx/nginx.conf 顶层 include。
# 安装命令见 deploy/sg-install-nginx.sh（会先备份 nginx.conf 并做 nginx -t 校验）。
#
# 阶段 1（本文件）：只监听 80，Cloudflare 橙云时代理到边缘 TLS；
# 阶段 2（有证书后）：用 deploy/nginx/reg-factory.conf 换成 443 + 301。

server {
    listen 80;
    listen [::]:80;
    server_name reg.ohlao.cfd;

    # 复用本机既有 ACME webroot（/var/www/letsencrypt）
    include /etc/nginx/la2-migrated/snippets/acme-challenge.conf;
    # 在 Cloudflare 后面时恢复真实客户端 IP，面板登录限流才按真实 IP 生效
    include /etc/nginx/la2-migrated/snippets/cloudflare-real-ip.conf;

    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # 运行日志 SSE：不缓冲、长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
