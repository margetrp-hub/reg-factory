# reg-factory Go 控制面 Nginx 站点（SG 主机，Cloudflare 橙云 + Let's Encrypt）
#
# 安装位置：/etc/nginx/reg-factory.conf（由 /etc/nginx/nginx.conf 顶层 include）
# 域名：reg.yhoo.lol → 140.245.54.144（Cloudflare 代理）
# 上游：127.0.0.1:8800（regd）
#
# 证书：/etc/letsencrypt/live/reg.yhoo.lol/（webroot /var/www/letsencrypt 签发，
#       certbot timer 自动续期；CF 未开启强制 HTTPS，所以 HTTP-01 可直通）

server {
    listen 80;
    listen [::]:80;
    server_name reg.yhoo.lol;

    include /etc/nginx/la2-migrated/snippets/acme-challenge.conf;
    include /etc/nginx/la2-migrated/snippets/cloudflare-real-ip.conf;

    # 续期走 80，其余跳 HTTPS（CF 已终结一次 TLS，这里保持一跳即可）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reg.yhoo.lol;

    include /etc/nginx/la2-migrated/snippets/cloudflare-real-ip.conf;

    ssl_certificate     /etc/letsencrypt/live/reg.yhoo.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reg.yhoo.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RFYHOO:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # 任务日志 SSE：不缓冲、长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
