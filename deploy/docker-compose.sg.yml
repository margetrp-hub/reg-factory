# SG 生产机 override：与 33 个现役容器共用 4C/24G 主机时的资源与网络隔离
#
#   cd /opt/reg-factory/deploy
#   sudo docker compose -f docker-compose.yml -f docker-compose.sg.yml up -d --build
#
# 设计依据（2026-10-31 实测）：
#   * 主机 4 vCPU / 24GB，已用约 4.6GB，可用约 19GB
#   * 单 Chromium 峰值 500MB-1GB，3 并发 + 面板 ≈ 4GB
#   * 上限 8GB / 3 vCPU：给浏览器任务设置资源上限
#   * memswap_limit 与 mem_limit 相等 = 容器内禁用 swap，避免整机卡死
#
# 为什么用 host 网络：
#   SG 上的 sub2api(127.0.0.1:18082)、cpa-manager(18317)、new-api(3008)、
#   grok2api(18081) 都只监听宿主回环，bridge 网络经 host.docker.internal
#   走的是 172.17.0.1，连不上。host 网络让容器的 127.0.0.1 就是宿主回环，
#   注册完的 token 可以直接导入这些现役服务。
#   代价：不再有 Docker 端口隔离，所以面板显式绑 127.0.0.1（见 environment），
#   公网入口只有 Nginx 反代。

services:
  panel:
    network_mode: host
    # 空列表会与基础文件的 ports 合并；显式 reset 才能移除端口发布。
    ports: !reset []
    mem_limit: 8g
    memswap_limit: 8g
    # 软限制：让内核优先回收页缓存，而不是等到 8G 硬顶触发 OOM kill
    mem_reservation: 5g
    cpus: "3.0"
    pids_limit: 4096
    environment:
      REGD_ADDR: "127.0.0.1:8800"
      # 节点身份、平台与密钥沿用 deploy/.env / /data/.env，不在 override 改写。
    labels:
      - "com.reg-factory.role=control-plane"
      - "com.reg-factory.host=sg"
